<!-- Echoes the connect-the-dots star in the team logo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
  <path d="M50 5 76.45 86.41 7.2 36.1 92.8 36.1 23.55 86.41Z"
        fill="none"
        stroke="var(--star-ink, #141414)"
        stroke-width="3.5"
        stroke-linejoin="round"
        stroke-linecap="round"/>
  <g fill="var(--star-node, #FFFFFF)" stroke="var(--star-ink, #141414)" stroke-width="3">
    <circle cx="50" cy="5" r="5"/>
    <circle cx="92.8" cy="36.1" r="5"/>
    <circle cx="76.45" cy="86.41" r="5"/>
    <circle cx="23.55" cy="86.41" r="5"/>
    <circle cx="7.2" cy="36.1" r="5"/>
  </g>
</svg>
